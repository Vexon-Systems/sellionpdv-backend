name: CI — Backend (Spring Boot)

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Testes do Backend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verificar Docker para os testes PostgreSQL
        run: docker info

      - name: Testar, empacotar e verificar cobertura
        run: ./mvnw -B verify --no-transfer-progress

      - name: Garantir que os testes PostgreSQL executaram
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          reports = glob.glob('target/surefire-reports/TEST-*PostgresTest.xml')
          assert reports, 'Nenhum relatório dos testes PostgreSQL encontrado'
          for report in reports:
              suite = ET.parse(report).getroot()
              assert int(suite.attrib['tests']) > 0, report
              assert int(suite.attrib.get('skipped', 0)) == 0, report
          PY

      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes-backend
          path: target/surefire-reports/
